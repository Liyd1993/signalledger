[project]
name = "signalledger"
version = "0.1.0"
description = "Evidence-backed product decisions with durable agent memory"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.40,<2",
  "fastapi>=0.115,<1",
  "mangum>=0.19,<1",
  "psycopg[binary]>=3.2,<4",
  "strands-agents[ollama]>=1.36,<2",
  "uvicorn>=0.30,<1",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
